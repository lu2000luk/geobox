[package]
name = "geobox-generator"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
bytemuck = { version = "1.25.2", features = ["derive"] }
futures-util = "0.3.34"
geobox-core = { version = "0.1.0", path = "../core" }
geobox-server = { version = "0.1.0", path = "../server" }
hex = "0.4.3"
md-5 = "0.11.0"
memmap2 = "0.9.12"
osmpbf = "0.3.8"
postcard = { version = "1.1.3", features = ["use-std"] }
rayon = "1.12.0"
reqwest = { version = "0.13.5", features = ["stream"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = "0.40.1"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zstd = "0.14.3"
